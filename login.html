{% extends "base.html" %}
{% block title %}Login – SmartSpend{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><i class="bi bi-wallet2 brand-icon"></i><h2 class="fw-bold">Welcome back</h2><p class="text-muted">Login to manage your student budget.</p></div>
    <form method="POST">
      <label class="form-label">Email</label>
      <input class="form-control mb-3" type="email" name="email" required placeholder="you@example.com">
      <label class="form-label">Password</label>
      <input class="form-control mb-3" type="password" name="password" required placeholder="••••••••">
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    <div class="demo-box mt-4"><strong>Demo:</strong> demo@student.com / Demo@123</div>
  </div>
</div>
{% endblock %}
