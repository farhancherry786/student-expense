{% extends "base.html" %}
{% block title %}Add Transaction – SmartSpend{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="form-card">
    <h2 class="fw-bold">Add Transaction</h2>
    <p class="text-muted">Record income or an expense.</p>
    <div id="formMessage"></div>
    <form id="transactionForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Type</label>
          <select class="form-select" id="type" required><option value="expense">Expense</option><option value="income">Income</option></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Amount (₹)</label>
          <input class="form-control" id="amount" type="number" min="0.01" step="0.01" required placeholder="500">
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select class="form-select" id="category" required></select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date</label>
          <input class="form-control" id="date" type="date" required>
        </div>
        <div class="col-12">
          <label class="form-label">Note</label>
          <textarea class="form-control" id="note" rows="3" placeholder="Example: Lunch at college canteen"></textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary"><i class="bi bi-check2"></i> Save Transaction</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/add_transaction.js') }}"></script>
{% endblock %}
