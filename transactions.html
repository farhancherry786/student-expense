{% extends "base.html" %}
{% block title %}Transactions – SmartSpend{% endblock %}
{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3"><div><h2 class="fw-bold">Transactions</h2><p class="text-muted">View and manage your income and expenses.</p></div><a href="{{ url_for('transaction_form') }}" class="btn btn-primary"><i class="bi bi-plus"></i> Add Transaction</a></div>
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <div class="row g-2 mb-3">
        <div class="col-md-4"><select id="filterType" class="form-select"><option value="">All Types</option><option value="income">Income</option><option value="expense">Expense</option></select></div>
        <div class="col-md-4"><select id="filterCategory" class="form-select"><option value="">All Categories</option>{% for c in expense_categories %}<option>{{ c }}</option>{% endfor %}{% for c in income_categories %}<option>{{ c }}</option>{% endfor %}</select></div>
        <div class="col-md-4"><button id="clearFilters" class="btn btn-outline-secondary w-100">Clear Filters</button></div>
      </div>
      <div id="txMessage"></div>
      <div class="table-responsive"><table class="table align-middle"><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Note</th><th>Amount</th><th>Action</th></tr></thead><tbody id="txBody"></tbody></table></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>
{% endblock %}
