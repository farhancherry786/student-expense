{% extends "base.html" %}
{% block title %}Register – SmartSpend{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4"><i class="bi bi-person-plus brand-icon"></i><h2 class="fw-bold">Create account</h2><p class="text-muted">Start tracking your money today.</p></div>
    <form method="POST">
      <label class="form-label">Full Name</label>
      <input class="form-control mb-3" name="name" required>
      <label class="form-label">Email</label>
      <input class="form-control mb-3" type="email" name="email" required>
      <label class="form-label">Password</label>
      <input class="form-control mb-3" type="password" name="password" minlength="6" required>
      <label class="form-label">Confirm Password</label>
      <input class="form-control mb-3" type="password" name="confirm_password" minlength="6" required>
      <button class="btn btn-primary w-100">Create Account</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
